<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <clipPath id="clip-red-diamond"><circle cx="64" cy="64" r="64"/></clipPath>
    <radialGradient id="red-diamond-bg" cx="50%" cy="38%" r="72%"><stop offset="0" stop-color="#3d3638"/><stop offset="1" stop-color="#0f0d0e"/></radialGradient>
    <linearGradient id="red-diamond-silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#c9c9d1"/><stop offset=".75" stop-color="#6f6f78"/><stop offset="1" stop-color="#e4e4ea"/></linearGradient>
    <linearGradient id="red-diamond-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5434c"/><stop offset=".6" stop-color="#a51d24"/><stop offset="1" stop-color="#6e1217"/></linearGradient>
  </defs>
  <g clip-path="url(#clip-red-diamond)">
    <rect width="128" height="128" fill="url(#red-diamond-bg)"/>
    <!-- chip edge: red with silver inserts -->
    <circle cx="64" cy="64" r="50" fill="none" stroke="#8c161c" stroke-width="7"/>
    <circle cx="64" cy="64" r="50" fill="none" stroke="url(#red-diamond-silver)" stroke-width="7" stroke-dasharray="9 17.2" transform="rotate(-6 64 64)"/>
    <circle cx="64" cy="64" r="44.5" fill="none" stroke="url(#red-diamond-silver)" stroke-width="1"/>
    <circle cx="64" cy="64" r="41" fill="#171415"/>
    <circle cx="64" cy="64" r="38" fill="none" stroke="#c9c9d1" stroke-width=".6" stroke-dasharray="1.5 2.2" opacity=".5"/>
    <path d="M64 33 L86 64 L64 95 L42 64 Z" fill="url(#red-diamond-red)" stroke="url(#red-diamond-silver)" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M64 39 L48 62" stroke="#ff9a9f" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
